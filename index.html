<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanakya ERP - Complete Institute Management</title>
<style>
:root{--p:#4f46e5;--pd:#4338ca;--bg:#f3f4f6;--sf:#fff;--tx:#1f2937;--tl:#6b7280;--bd:#e5e7eb;--ok:#10b981;--wn:#f59e0b;--no:#ef4444;--pr:#8b5cf6;--info:#3b82f6}
[data-theme="dark"]{--bg:#0f172a;--sf:#1e293b;--tx:#f1f5f9;--tl:#94a3b8;--bd:#334155}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,var(--p),var(--pr));min-height:100vh}

.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-box{background:var(--sf);padding:35px;border-radius:20px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.auth-box h1{text-align:center;color:var(--p);font-size:26px;margin-bottom:5px}
.auth-box .sub{text-align:center;color:var(--tl);font-size:13px;margin-bottom:22px}
.panel-select{display:flex;gap:8px;margin-bottom:18px}
.panel-btn{flex:1;padding:12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);cursor:pointer;font-weight:600;color:var(--tx);transition:0.3s;font-size:13px}
.panel-btn.active{border-color:var(--p);background:var(--p);color:#fff}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--tx)}
.fc{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:13px}
.fc:focus{border-color:var(--p);outline:none}
.btn-p{width:100%;padding:12px;background:var(--p);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.link{color:var(--p);cursor:pointer;font-size:12px;text-align:center;margin-top:10px;display:block}

#mainApp{display:none;min-height:100vh;background:var(--bg)}
body.app-mode{background:var(--bg)}
.topbar{background:var(--sf);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.1);position:sticky;top:0;z-index:50}
.top-left{display:flex;align-items:center;gap:10px}
.menu-btn{font-size:22px;background:none;border:none;cursor:pointer;color:var(--tx)}
.logo-text h2{font-size:16px;color:var(--p)}
.logo-text p{font-size:10px;color:var(--tl)}
.top-right{display:flex;align-items:center;gap:8px}
.icon-btn{background:var(--bg);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:none;cursor:pointer;position:relative}
.badge-count{position:absolute;top:-3px;right:-3px;background:var(--no);color:#fff;font-size:9px;font-weight:bold;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.user-profile{display:flex;align-items:center;gap:8px;cursor:pointer}
.avatar{width:36px;height:36px;background:var(--p);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}
.user-info .name{font-size:12px;font-weight:600}
.user-info .role{font-size:10px;color:var(--tl)}

.app-body{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:240px;background:var(--sf);border-right:1px solid var(--bd);position:fixed;left:0;top:60px;bottom:0;overflow-y:auto;z-index:40;transform:translateX(-100%);transition:transform 0.3s}
.sidebar.open{transform:translateX(0)}
.nav-sec{padding:10px 16px 3px;font-size:10px;font-weight:700;color:var(--tl);text-transform:uppercase}
.nav-item{padding:10px 16px;display:flex;align-items:center;gap:10px;color:var(--tx);font-size:13px;cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:rgba(79,70,229,0.1);color:var(--p);border-left-color:var(--p)}
.nav-item .ic{font-size:16px;width:20px;text-align:center}
.main-content{flex:1;padding:18px;margin-left:0;overflow-y:auto}
@media(min-width:768px){.sidebar{transform:translateX(0)}.main-content{margin-left:240px}}

.welcome{background:linear-gradient(135deg,var(--p),var(--pr));color:#fff;padding:22px;border-radius:12px;margin-bottom:18px}
.welcome h1{font-size:20px;margin-bottom:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--sf);padding:16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-top:4px solid var(--p)}
.stat h3{font-size:10px;color:var(--tl);text-transform:uppercase;margin-bottom:5px}
.stat .v{font-size:22px;font-weight:800;color:var(--tx)}
.stat.green{border-top-color:var(--ok)}
.stat.orange{border-top-color:var(--wn)}
.stat.red{border-top-color:var(--no)}
.stat.purple{border-top-color:var(--pr)}
.card{background:var(--sf);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);margin-bottom:16px}
.card-h{padding:13px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.card-h h2{font-size:14px}
.card-b{padding:16px}
.btn{padding:8px 16px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.btn-p{background:var(--p);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-wn{background:var(--wn);color:#fff}
.btn-no{background:var(--no);color:#fff}
.btn-sm{padding:4px 9px;font-size:11px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.qbtn{padding:18px 12px;border-radius:10px;color:#fff;font-weight:600;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:90px;font-size:12px}
.qbtn .ic{font-size:26px}

table{width:100%;border-collapse:collapse}
th,td{padding:9px;text-align:left;border-bottom:1px solid var(--bd);font-size:12px}
th{background:var(--bg);font-weight:600;color:var(--tl);text-transform:uppercase;font-size:10px}
.badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700}
.b-ok{background:#d1fae5;color:#065f46}
.b-wn{background:#fef3c7;color:#92400e}
.b-no{background:#fee2e2;color:#991b1b}

.toast{position:fixed;top:12px;right:12px;background:var(--sf);padding:11px 18px;border-radius:9px;box-shadow:0 5px 20px rgba(0,0,0,0.2);z-index:9999;display:none;border-left:4px solid var(--ok);font-size:12px}
.toast.show{display:block;animation:slide 0.3s}
.toast.err{border-left-color:var(--no)}
@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.modal-box{background:var(--sf);padding:20px;border-radius:12px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.frow{grid-template-columns:1fr}}

.empty{text-align:center;padding:25px;color:var(--tl)}
.empty .ic{font-size:35px;margin-bottom:6px;opacity:0.5}

.id-card{width:300px;background:linear-gradient(135deg,var(--p),var(--pr));color:#fff;padding:18px;border-radius:10px;margin:0 auto;text-align:center}
.id-card .photo{width:70px;height:70px;background:#fff;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--p);font-weight:bold}
.id-card h3{margin-bottom:4px;font-size:16px}
.id-card p{font-size:11px;opacity:0.9}
.id-card .details{background:rgba(255,255,255,0.2);padding:8px;border-radius:7px;margin-top:8px;text-align:left;font-size:11px}
.id-card .details div{margin:3px 0}

.receipt{background:#fff;padding:18px;border:2px dashed var(--bd);border-radius:9px;max-width:380px;margin:0 auto}
.receipt h3{text-align:center;color:var(--p);margin-bottom:8px;font-size:16px}
.receipt .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px}
.receipt .total{font-weight:bold;font-size:14px;color:var(--p)}

.certificate{background:#fff;padding:25px;border:3px double var(--p);border-radius:9px;text-align:center;max-width:480px;margin:0 auto}
.certificate h2{color:var(--p);margin-bottom:8px;font-size:20px}
.certificate .name{font-size:22px;color:var(--tx);margin:12px 0;font-weight:bold}
.certificate p{margin:6px 0;color:var(--tl);font-size:13px}

.notice-item{background:var(--bg);padding:10px;border-radius:7px;margin-bottom:8px;border-left:4px solid var(--p)}
.notice-item.urgent{border-left-color:var(--no)}
.notice-item h4{margin-bottom:3px;font-size:13px}
.notice-item p{font-size:11px;color:var(--tl)}

.tt-grid{display:grid;grid-template-columns:90px repeat(5,1fr);gap:4px}
.tt-cell{background:var(--bg);padding:6px;border-radius:5px;text-align:center;font-size:10px}
.tt-cell.header{background:var(--p);color:#fff;font-weight:600}
.tt-cell.time{background:var(--wn);color:#fff;font-weight:600}

.book-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:7px;margin-bottom:6px}
.book-icon{font-size:26px}
.book-info{flex:1}
.book-info h4{font-size:13px;margin-bottom:2px}
.book-info p{font-size:10px;color:var(--tl)}

.log-item{padding:8px;border-bottom:1px solid var(--bd);font-size:11px}
.log-item .t{font-weight:600;color:var(--tx)}
.log-item .d{color:var(--tl);font-size:10px;margin-top:2px}

@media print{
  .topbar,.sidebar,.btn,.menu-btn{display:none!important}
  .main-content{margin-left:0!important}
  .id-card,.receipt,.certificate{box-shadow:none}
}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-box">
    <h1>🎓 Chanakya ERP</h1>
    <p class="sub">Complete Institute Management System</p>
    <div class="panel-select">
      <button class="panel-btn active" onclick="selectPanel('admin')" id="btnAdmin">‍💼 Admin Panel</button>
      <button class="panel-btn" onclick="selectPanel('student')" id="btnStudent">👨🎓 Student Panel</button>
    </div>
    <div id="instReg" style="display:none">
      <h3 style="margin-bottom:10px;color:var(--p)"> Institute Registration</h3>
      <div class="fg"><label>🏫 Institute Name *</label><input type="text" id="instName" class="fc"></div>
      <div class="fg"><label>👤 Admin Name *</label><input type="text" id="adminName" class="fc"></div>
      <div class="fg"><label>📱 Mobile *</label><input type="text" id="instMob" class="fc" maxlength="10"></div>
      <div class="fg"><label>📧 Email</label><input type="email" id="instEmail" class="fc"></div>
      <div class="fg"><label>📍 Address</label><input type="text" id="instAddr" class="fc"></div>
      <div class="fg"><label> Username *</label><input type="text" id="regUser" class="fc"></div>
      <div class="fg"><label>🔒 Password *</label><input type="password" id="regPass" class="fc"></div>
      <button class="btn-p" onclick="registerInstitute()">✅ Register Institute</button>
      <span class="link" onclick="backToAdminLogin()">← Back to Login</span>
    </div>
    <div id="adminLogin">
      <div class="fg"><label>👤 Username</label><input type="text" id="aUser" class="fc" placeholder="Enter username"></div>
      <div class="fg"><label>🔒 Password</label><input type="password" id="aPass" class="fc" placeholder="Enter password"></div>
      <button class="btn-p" onclick="adminLogin()">🚀 Login</button>
      <span class="link" onclick="showInstReg()"> New Institute? Register Here</span>
    </div>
    <div id="studentLogin" style="display:none">
      <div class="fg"><label>🏫 Select Institute</label><select id="stuInst" class="fc"></select></div>
      <div class="fg"><label>🆔 Student ID</label><input type="text" id="sId" class="fc" placeholder="e.g. STU001"></div>
      <div class="fg"><label>📱 Mobile Number</label><input type="text" id="sMob" class="fc" placeholder="Enter mobile"></div>
      <button class="btn-p" style="background:var(--ok)" onclick="studentLogin()">🚀 Login</button>
      <p style="text-align:center;margin-top:10px;font-size:11px;color:var(--tl)">📞 Contact your institute admin for Student ID</p>
    </div>
  </div>
</div>

<div id="mainApp">
  <div class="topbar">
    <div class="top-left">
      <button class="menu-btn" onclick="togSide()">☰</button>
      <div class="logo-text">
        <h2 id="instNameDisplay">Institute</h2>
        <p id="panelType">Panel</p>
      </div>
    </div>
    <div class="top-right">
      <button class="icon-btn" onclick="togTheme()" id="themeBtn">🌙</button>
      <button class="icon-btn" onclick="showNotifs()" id="notifBtn">🔔<span class="badge-count" id="notifCount">0</span></button>
      <div class="user-profile" onclick="showProfile()">
        <div class="user-info">
          <div class="name" id="uName">User</div>
          <div class="role" id="uRole">Role</div>
        </div>
        <div class="avatar" id="uAvatar">U</div>
      </div>
    </div>
  </div>
  <div class="app-body">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content" id="content"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-h">
      <h3 id="modalTitle">Title</h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DB={
  instId:null,
  setInst:function(id){this.instId=id},
  get:function(k){try{return JSON.parse(localStorage.getItem('inst_'+this.instId+'_'+k))||[]}catch(e){return []}},
  set:function(k,v){localStorage.setItem('inst_'+this.instId+'_'+k,JSON.stringify(v))},
  getO:function(k){try{return JSON.parse(localStorage.getItem('inst_'+this.instId+'_'+k))||{}}catch(e){return {}}},
  setO:function(k,v){localStorage.setItem('inst_'+this.instId+'_'+k,JSON.stringify(v))}
};
const INST={
  get:function(){try{return JSON.parse(localStorage.getItem('cci_institutes'))||[]}catch(e){return []}},
  set:function(v){localStorage.setItem('cci_institutes',JSON.stringify(v))}
};

let currentUser=null,currentPanel='admin',dark=false;

function toast(m,e){var t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(function(){t.className='toast'},3000)}
function selectPanel(panel){
  currentPanel=panel;
  document.getElementById('btnAdmin').classList.toggle('active',panel==='admin');
  document.getElementById('btnStudent').classList.toggle('active',panel==='student');
  document.getElementById('instReg').style.display='none';
  document.getElementById('adminLogin').style.display='none';
  document.getElementById('studentLogin').style.display='none';
  if(panel==='admin')document.getElementById('adminLogin').style.display='block';
  else{document.getElementById('studentLogin').style.display='block';loadInstitutesForStudent();}
}
function loadInstitutesForStudent(){
  var insts=INST.get(),sel=document.getElementById('stuInst');
  sel.innerHTML='<option value="">-- Select Institute --</option>';
  insts.forEach(function(i){sel.innerHTML+='<option value="'+i.id+'">'+i.name+'</option>'});
}
function showInstReg(){document.getElementById('instReg').style.display='block';document.getElementById('adminLogin').style.display='none'}
function backToAdminLogin(){document.getElementById('instReg').style.display='none';document.getElementById('adminLogin').style.display='block'}

function registerInstitute(){
  var name=document.getElementById('instName').value.trim(),adminName=document.getElementById('adminName').value.trim(),mob=document.getElementById('instMob').value.trim(),email=document.getElementById('instEmail').value.trim(),addr=document.getElementById('instAddr').value.trim(),user=document.getElementById('regUser').value.trim(),pass=document.getElementById('regPass').value;
  if(!name||!adminName||!mob||!user||!pass){toast('Fill all required fields!',true);return}
  if(mob.length!==10){toast('Mobile must be 10 digits!',true);return}
  if(pass.length<4){toast('Password min 4 chars!',true);return}
  var insts=INST.get();
  if(insts.find(function(i){return i.adminUser===user})){toast('Username already taken!',true);return}
  var instId='INST'+Date.now();
  insts.push({id:instId,name:name,adminName:adminName,mob:mob,email:email,address:addr,adminUser:user,adminPass:pass,registeredDate:new Date().toLocaleDateString()});
  INST.set(insts);
  DB.setInst(instId);
  DB.set('students',[]);DB.set('courses',[]);DB.set('fees',[]);DB.set('attendance',[]);DB.set('exams',[]);DB.set('expenses',[]);DB.set('notifications',[]);DB.set('notices',[]);DB.set('library',[]);DB.set('timetable',[]);DB.set('certificates',[]);DB.set('logs',[]);DB.set('staff',[]);
  DB.setO('settings',{name:name,phone:mob,email:email,address:addr});
  toast('✅ Institute registered! ID: '+instId);
  backToAdminLogin();
  document.getElementById('aUser').value=user;
}

function adminLogin(){
  var u=document.getElementById('aUser').value.trim(),p=document.getElementById('aPass').value;
  if(!u||!p){toast('Fill all fields!',true);return}
  var insts=INST.get(),inst=insts.find(function(i){return i.adminUser===u&&i.adminPass===p});
  if(inst){
    DB.setInst(inst.id);
    currentUser={name:inst.adminName,role:'ADMIN',user:u,instId:inst.id,instName:inst.name};
    document.getElementById('instNameDisplay').textContent=inst.name;
    enterApp('admin');toast('Welcome, '+inst.adminName+'!');
  }else{toast('Invalid credentials!',true)}
}

function studentLogin(){
  var instId=document.getElementById('stuInst').value,id=document.getElementById('sId').value.toUpperCase().trim(),mob=document.getElementById('sMob').value.trim();
  if(!instId){toast('Select institute!',true);return}
  if(!id||!mob){toast('Fill all fields!',true);return}
  DB.setInst(instId);
  var students=DB.get('students'),s=students.find(function(x){return x.id===id&&x.mob===mob});
  if(s){
    var insts=INST.get(),inst=insts.find(function(i){return i.id===instId});
    currentUser={name:s.name,role:'STUDENT',id:s.id,mob:s.mob,course:s.cou,instId:instId,instName:inst?inst.name:''};
    document.getElementById('instNameDisplay').textContent=inst?inst.name:'';
    enterApp('student');toast('Welcome, '+s.name+'!');
  }else{toast('Invalid Student ID or Mobile!',true)}
}

function enterApp(panel){
  document.getElementById('authScreen').style.display='none';
  document.getElementById('mainApp').style.display='block';
  document.body.classList.add('app-mode');
  document.getElementById('panelType').textContent=panel==='admin'?'Admin Panel':'Student Panel';
  document.getElementById('uName').textContent=currentUser.name;
  document.getElementById('uRole').textContent=currentUser.role;
  document.getElementById('uAvatar').textContent=currentUser.name.charAt(0).toUpperCase();
  if(panel==='admin'){renderAdminSidebar();renderAdminDashboard()}
  else{renderStudentSidebar();renderStudentDashboard()}
  updateNotifCount();
}
function togSide(){document.getElementById('sidebar').classList.toggle('open')}
function togTheme(){dark=!dark;document.documentElement.setAttribute('data-theme',dark?'dark':'light');document.getElementById('themeBtn').textContent=dark?'☀️':''}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openModal(t,h){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=h;document.getElementById('modal').classList.add('show')}
function updateNotifCount(){if(!currentUser)return;document.getElementById('notifCount').textContent=DB.get('notifications').length}

function addLog(action,details){var logs=DB.get('logs');logs.unshift({action:action,details:details||'',time:new Date().toLocaleString(),user:currentUser?currentUser.name:'System'});if(logs.length>100)logs.length=100;DB.set('logs',logs)}

/* ============ ADMIN SIDEBAR ============ */
function renderAdminSidebar(){
  var h='<div class="nav-sec">🏠 MAIN</div>';
  h+='<div class="nav-item active" onclick="renderAdminDashboard()"><span class="ic"></span>Dashboard</div>';
  h+='<div class="nav-sec">👥 MANAGEMENT</div>';
  h+='<div class="nav-item" onclick="renderAdminStudents()"><span class="ic">👨‍🎓</span>Students</div>';
  h+='<div class="nav-item" onclick="renderAdminCourses()"><span class="ic">📚</span>Courses</div>';
  h+='<div class="nav-item" onclick="renderAdminStaff()"><span class="ic">👨‍🏫</span>Staff</div>';
  h+='<div class="nav-sec">🎓 ACADEMIC</div>';
  h+='<div class="nav-item" onclick="renderAdminAttendance()"><span class="ic"></span>Attendance</div>';
  h+='<div class="nav-item" onclick="renderAdminExams()"><span class="ic">📝</span>Exams</div>';
  h+='<div class="nav-item" onclick="renderAdminTimetable()"><span class="ic">🗓️</span>Timetable</div>';
  h+='<div class="nav-sec">💰 FINANCE</div>';
  h+='<div class="nav-item" onclick="renderAdminFees()"><span class="ic">💵</span>Fees</div>';
  h+='<div class="nav-item" onclick="renderAdminExpenses()"><span class="ic">📉</span>Expenses</div>';
  h+='<div class="nav-sec">📚 LIBRARY</div>';
  h+='<div class="nav-item" onclick="renderAdminLibrary()"><span class="ic">📖</span>Library</div>';
  h+='<div class="nav-sec">📢 COMMUNICATION</div>';
  h+='<div class="nav-item" onclick="renderAdminNotices()"><span class="ic">📢</span>Notices</div>';
  h+='<div class="nav-item" onclick="renderAdminAlerts()"><span class="ic">🔔</span>Alerts</div>';
  h+='<div class="nav-sec">🎨 GENERATORS</div>';
  h+='<div class="nav-item" onclick="renderAdminIdCards()"><span class="ic">🪪</span>ID Cards</div>';

  h+='<h3 style="margin-bottom:8px">📥 Download Backup</h3>';
  h+='<p style="font-size:11px;color:var(--tl);margin-bottom:8px">Download all your institute data as JSON file</p>';
  h+='<button class="btn btn-p" onclick="downloadBackup()">💾 Download Backup</button>';
  h+='<hr style="margin:15px 0">';
  h+='<h3 style="margin-bottom:8px">📤 Restore Backup</h3>';
  h+='<p style="font-size:11px;color:var(--tl);margin-bottom:8px">Restore data from backup file</p>';
  h+='<input type="file" id="restoreFile" accept=".json" onchange="restoreBackup(event)" style="margin-bottom:8px">';
  h+='</div></div>';document.getElementById('content').innerHTML=h;
}
function downloadBackup(){
  var data={institute:INST.get().find(function(i){return i.id===currentUser.instId}),students:DB.get('students'),courses:DB.get('courses'),fees:DB.get('fees'),attendance:DB.get('attendance'),exams:DB.get('exams'),expenses:DB.get('expenses'),notifications:DB.get('notifications'),notices:DB.get('notices'),library:DB.get('library'),timetable:DB.get('timetable'),logs:DB.get('logs'),settings:DB.getO('settings'),staff:DB.get('staff'),date:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chanakya_backup_'+currentUser.instId+'_'+Date.now()+'.json';a.click();
  toast('✅ Backup downloaded!');
}
function restoreBackup(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(!confirm('This will replace ALL current data. Continue?'))return;
      if(d.students)DB.set('students',d.students);if(d.courses)DB.set('courses',d.courses);if(d.fees)DB.set('fees',d.fees);if(d.attendance)DB.set('attendance',d.attendance);if(d.exams)DB.set('exams',d.exams);if(d.expenses)DB.set('expenses',d.expenses);if(d.notifications)DB.set('notifications',d.notifications);if(d.notices)DB.set('notices',d.notices);if(d.library)DB.set('library',d.library);if(d.timetable)DB.set('timetable',d.timetable);if(d.logs)DB.set('logs',d.logs);if(d.settings)DB.setO('settings',d.settings);if(d.staff)DB.set('staff',d.staff);
      addLog('Data Restored','From backup');toast('✅ Data restored!');renderAdminDashboard();
    }catch(err){toast('❌ Invalid file!',true)}
  };
  r.readAsText(f);
}
